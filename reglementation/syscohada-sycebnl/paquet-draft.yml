# paquet-draft.yml — états financiers OHADA (SYSCOHADA système normal / SMT, SYCEBNL). Brouillon de recherche 2026-10-19.
# Format : zone, rapports[ {code,libelle,periodicite,delaiJours,assujettis,layout,source,lignes[ {code,libelle,comptes|expression,sens,colonnes} ]} ]
zone: OHADA
regulateur: OHADA (AUDCIF 26/01/2017 ; Acte uniforme SYCEBNL 22/12/2022)
planComptable: SYSCOHADA révisé (PCG OHADA 2017) / SYCEBNL (JO OHADA 22/02/2023)
version: draft-2026-10-19
statut: 'BROUILLON non committé : à valider (vérification ◐/?)'
conventions:
  comptes: préfixes séparés par virgule ; '-' devant un préfixe = solde retranché (amortissements 28, dépréciations 29, 39, 49, 59)
  expression: codes de postes du même rapport + - * / ; 'RAPPORT.CODE' = poste d'un autre rapport ; suffixe [N-1] = exercice précédent
  soldeRetenu: DEBITEUR | CREDITEUR ; absent = solde retenu quel que soit le sens ; les comptes déduits (-) sont toujours retenus quel que soit le sens
  extensionsTFT: 'flux: MOUVEMENTS_DEBIT|MOUVEMENTS_CREDIT ; variationCreances/variationDettes/variationStocks = comptes dont la variation N-1 -> N corrige l''encaissement/décaissement'
  confiance: HAUTE = ref+libellé+structure lus dans texte primaire (JO) ; MOYENNE = comptes dérivés du plan officiel ou du JSON existant ; BASSE = rattachement hypothétique
rapports:
