  - {code: RDC-REP-009, libelle: Engagements recus de la faitiere et autres IF, periodicite: MENSUELLE, delaiJours: 15, assujettis: [COOPEC, IMF], layout: ANNEXE, source: "Instruction BCC 009 art. 1A (compte NON TROUVE)", lignes: [{code: ENG_RECUS_IF, libelle: Engagements recus, comptes: null, sens: C}]}
