# Paquet RDC BCC - DRAFT 2026-10-19. Aucun compte invente : comptes null = NON TROUVE.
# Expression : codes de lignes + - * / (constantes numeriques admises). Comptes : prefixes separes par virgule, '-' pour soustraire.
# Extensions facultatives : note, base (MOYENNE_PERIODE), source (sous-journal metier).
# layout : LIGNES | ANNEXE | DOCUMENT | RATIOS
zone: RDC
regulateur: BCC
planComptable: PCCI
version: draft-2026-10-19
pays: [CD]
typesAssujettis: [COOPEC, IMF, FAITIERE]
devise: {presentation: CONFIGURABLE, tauxReference: "cours indicatif BCC du dernier jour (choix de produit, RDC-RPT-114)"}
sanctions:
  - {rapports: "RDC-REP-001..016", retardParJourUSD: 10, incompletParEtatUSD: 10}
  - {rapports: "RDC-REP-028", retardParJourUSD: 5}
  - {rapports: "RDC-REP-017", retardParJourUSD: 5}
  - {motif: "etats non conformes PCCI", COOPEC_USD: 1000, IMF_USD: 2500}
  - {note: "equivalent CDF, taux non precise ; Recueil BCC 2019 pp. 69-71 (OCR, MOYENNE)"}
rapports:
  - code: RDC-REP-001
    libelle: Bilan (actif et passif)
    periodicite: MENSUELLE
    delaiJours: 15
    assujettis: [COOPEC, IMF]
    layout: LIGNES
    source: "Instruction BCC 009, 14/04/2012, art. 1A"
    lignes:
      - {code: A_CAISSE, libelle: Caisse, comptes: "57", sens: D}
      - {code: A_BANQUE, libelle: "Banque, organe faitier et autres IF", comptes: "56", sens: D}
      - {code: A_CRED_CT, libelle: Credits a court terme, comptes: "32", sens: D}
      - {code: A_CRED_MT, libelle: Credits a moyen terme, comptes: "31", sens: D}
      - {code: A_CRED_LT, libelle: Credits a long terme, comptes: "30", sens: D}
      - {code: A_LITIGIEUX, libelle: Creances litigieuses, comptes: "39", sens: D}
      - {code: A_PROVISIONS, libelle: Provisions sur creances, comptes: "38", sens: C, note: "en deduction (proposition)"}
      - {code: A_DEBITEURS, libelle: Debiteurs divers, comptes: "46", sens: D, note: "libelle de 46 non verifie"}
      - {code: A_REGUL, libelle: Regularisations et emplois divers, comptes: "47", sens: D}
      - {code: A_IMMO, libelle: Immobilisations nettes, comptes: "2", sens: D}
      - {code: TOTAL_ACTIF, libelle: TOTAL ACTIF, expression: "A_CAISSE + A_BANQUE + A_CRED_CT + A_CRED_MT + A_CRED_LT + A_LITIGIEUX - A_PROVISIONS + A_DEBITEURS + A_REGUL + A_IMMO"}
      - {code: P_EMPRUNTS_TRESO, libelle: "Emprunts a terme (faitier, autres IF)", comptes: null, sens: C, note: "NON TROUVE ; libelle modele: Emprunts a terme (organe faitier et autre IF) ; ne pas rattacher 16/162"}
      - {code: P_EPARGNES, libelle: Epargnes et depots ordinaires, comptes: "33", sens: C}
      - {code: P_DAT, libelle: Depots a terme, comptes: "34", sens: C}
      - {code: P_REGIME_SPECIAL, libelle: Depots a regime special, comptes: "35", sens: C}
      - {code: P_AUTRES_CLIENTELE, libelle: Autres comptes de la clientele, comptes: "36", sens: C}
      - {code: P_LIAISON, libelle: Compte de liaison, comptes: "451", sens: C}
      - {code: P_CREDITEURS, libelle: Crediteurs divers, comptes: "46", sens: C}
      - {code: P_REGUL, libelle: Regularisations, comptes: "47", sens: C}
      - {code: P_EMPRUNTS_MLT, libelle: Emprunts et dettes M et L terme, comptes: "16", sens: C}
      - {code: P_CAPITAL, libelle: Capital, comptes: "10", sens: C}
      - {code: P_REPORT, libelle: Report a nouveau, comptes: "120,-121", sens: C}
      - {code: P_RESULTAT, libelle: Resultat net, comptes: "130,-131", sens: C}
      - {code: P_RESERVES, libelle: "Reserves, provisions, fonds", comptes: "11,14,15,17,18", sens: C}
      - {code: TOTAL_PASSIF, libelle: TOTAL PASSIF, expression: "P_EPARGNES + P_DAT + P_REGIME_SPECIAL + P_AUTRES_CLIENTELE + P_LIAISON + P_CREDITEURS + P_REGUL + P_EMPRUNTS_MLT + P_CAPITAL + P_REPORT + P_RESULTAT + P_RESERVES"}
