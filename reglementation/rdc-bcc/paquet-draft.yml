      - {code: ROA, libelle: Rendement sur actif, source: "resultat d'exploitation hors subvention / actif moyen", base: MOYENNE_PERIODE, norme: {operateur: ">", valeur: 0.03}}
      - {code: RENDEMENT_PORTEFEUILLE, libelle: Rendement du portefeuille, source: "interets et commissions percus / encours moyen brut", base: MOYENNE_PERIODE, norme: {operateur: ">", valeur: 0.15}}
      - {code: AUTOSUFFISANCE, libelle: Autosuffisance operationnelle, source: "produits / charges d'exploitation hors exceptionnels", norme: {operateur: ">", valeur: 1.192}}
      - {code: ENCAISSE_OISIVE, libelle: Taux d'encaisse oisive, expression: "DISPONIBLES / TOTAL_ACTIF", norme: {operateur: "<", valeur: 0.20}}
      - {code: TAUX_ENCOURS, libelle: Taux d'encours de credit, expression: "PORTEFEUILLE_BRUT / TOTAL_ACTIF", norme: {operateur: ">", valeur: 0.70}}
      - {code: TAUX_IMMO, libelle: Taux des immobilisations, expression: "A_IMMO / TOTAL_ACTIF", norme: {operateur: "<", valeur: 0.10}}
