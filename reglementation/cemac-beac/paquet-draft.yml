  - code: NJ07
    libelle: Immobilisations nettes (G)
    comptes: 21,22,23,26,-29
    sens: D
  - code: NJ08
    libelle: Solde H = D + E - F - G
    expression: NJ04+NJ05-NJ06-NJ07
