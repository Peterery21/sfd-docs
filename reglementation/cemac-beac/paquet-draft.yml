# Paquet réglementaire CEMAC/COBAC EMF - BROUILLON de recherche (non chargé par le produit)
# Sources : voir reporting.md. Aucun compte inventé ; NON TROUVÉ = lacune.
zone: CEMAC-BEAC
regulateur: COBAC / BEAC
planComptable: PCEMF (janvier 2010)
version: draft-2026-10-19
pays:
- CM
- GA
- CG
- TD
- CF
- GQ
conventions:
  comptes: préfixes séparés par virgule ; préfixe '-' = à soustraire (provisions, exclusions) ; suffixe dr/cr = solde débiteur/créditeur seulement (convention des tables COBAC)
  exclut: sous-comptes de réseau (5e chiffre 9) exclus du poste ; sans effet pour un EMF hors réseau
  amortProv: colonne amortissements/provisions du bilan (brut - amort/prov = net)
  FPN: fonds patrimoniaux nets (cat. 1, ligne JT24) ou fonds propres nets (cat. 2/3, ligne KL25)
  CROSS_SERVICE: 'donnée à fournir par un autre service (par bénéficiaire, échéancier, statistiques) : pas de compte'
  norme.valeur: pourcentage sauf SM/DB05 (multiple)
  avertissement: le modèle COBAC source est marqué PROJET ; plusieurs seuils du modèle divergent des règlements 2002 ; les règlements prévalent (voir reporting.md section e)
  textes2017: "règlements 2002 toujours cités comme normes en vigueur en 2025 ; R-2017/06 = contrôle interne, R-2017/07 = classification/provisionnement, R-2017/08 = plafonds (CEMAC-RPT-105)"
  classesPCEMF: "1 capitaux permanents, 2 valeurs immobilisées, 3 opérations clientèle (30 LT, 31 MT, 32 CT, 33 souffrance, 37 ordinaires, 39 provisions), 4 tiers/régularisation, 5 trésorerie/interbancaire, 6 charges, 7 produits, 8 SIG, 9 hors bilan (CEMAC-RPT-101/102)"
transmission:
  canal: SPECTRA / SESAME 4.0 (www.spectracobac.org)
  obligatoire: true
  dernierFormatAncien: 2025-12-31
  formatFichier: NON_TROUVE
  exportParametrable: true
  source: Circulaire COBAC fin oct. 2025 (CEMAC-RPT-110, MOYENNE)
penaliteRetard:
  source: Règl. COBAC EMF R-2024/01 (CEMAC-RPT-109)
  EMF_AFFILIE_RESEAU: {jours1a15: 15000, jours16a30: 25000, auDela: 75000, unite: FCFA/jour}
  AUTRES_EMF: NON_TROUVE
normesComplementaires:
  - code: PLAFOND_CLIENT
    libelle: Encours maximal par client
    regle: "<= 10 % du capital social libéré (toute catégorie) ; apparentés (actionnaires, administrateurs, dirigeants, employés) <= 50 000 000 FCFA"
    sourceDonnees: CROSS_SERVICE
    cumulAvec: plafonds FPN Règl. 2002/10
    source: Règl. COBAC EMF R-2017/08 art. 2, en vigueur 01/07/2018 (CEMAC-RPT-106)
    confiance: MOYENNE
avertissements:
  - "FOGADAC non applicable aux EMF : plafonds 8 M / 15 M FCFA réservés aux établissements de crédit (Règl. 03/25, CEMAC-RPT-115, MOYENNE)"
