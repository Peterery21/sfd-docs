    comptes: 30,31,32,33,37dr,386,38819,-39
    sens: D
    note: 'Partiel : part refinancée par ressources externes'
  - code: NJ03
    libelle: Solde C = A - B
    expression: NJ01-NJ02
    note: 'texte 2002/12 art. 2 : encours net diminué des crédits adossés à ressources externes ; l''annexe indique (A)+(B) = encours total net : formulation à confirmer'
  - code: NJ04
    libelle: Fonds patrimoniaux ou fonds propres nets (D)
