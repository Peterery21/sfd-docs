zone: UEMOA-BCEAO
objet: Comptes de classe 9 (hors-bilan) du RCSFD à ajouter au plan comptable EDIP UEMOA
source:
  S1: 'RCSFD UMOA 1re édition (ISBN 978-2-916140-08-7), plan de comptes classe 9 p. 96-98, fonctionnement p. 262-278 : https://microfinance.tresor.gouv.ci/micro/wp-content/uploads/2019/11/RCSSFD.pdf'
  S2: 'Guide méthodologique de l''audit externe des SFD UEMOA (oct. 2010), annexe 2 p. 193-194, texte identique à S1 : https://www.findevgateway.org/sites/default/files/publications/files/mfg-fr-outils-guide-audit-externe-sfd-zone-uemoa-10-2010.pdf'
  recherche: 2026-10-23 (Tavily, pages relues)
confiance:
  comptesEtLibelles: HAUTE   # S1 et S2 concordants
  version: MOYENNE           # absente du PDF allégé cb-umoa (nov. 2009, classes 1-7) ; développée seule inférée, aucun texte ne le dit
  posteDimfHb: MOYENNE       # postes N/P/Q du modèle DIMF 2000-HB, détail (N1A…) non vérifié dans S1/S2
version: DEVELOPPEE          # ajout au plan EDIP par défaut, à confirmer (voir aValider)
aValider:
  - Classe 9 absente du plan allégé et obligatoire seulement en développé (SFD art. 44)
  - Rattachement compte → poste DIMF-HB détaillé (N1A, N2H…)
  - Création des comptes miroir 980-985 dans EDIP (partie double) ou écriture simple
  - 'Coquille probable S1 sur 902 (contrepartie 980 à l''utilisation)'
  - Référence exacte de l'instruction BCEAO qui rend le RCSFD obligatoire
contreparties:
  regle: 'Partie double : contrepartie = 98 + 3e chiffre du compte (90x→980, 91x→981, 92x→982, 933→983, 95x→985). Exceptions : 93 (sauf 933) via 937/938, et 961-966 entre eux. 99 n''est pas un miroir.'
  sens: 'Débit si la réalisation se traduirait au bilan par un débit (financement donné, titres/devises à recevoir), crédit sinon (garantie reçue, titres à livrer).'
  comptes:
  - {compte: '980', libelle: 'Contrepartie des engagements de financement', origine: 'S1 p. 262-278 (cité dans le fonctionnement, absent de la liste p. 97-98)'}
  - {compte: '981', libelle: 'Contrepartie des engagements de garantie', origine: 'S1 p. 262-278 (cité dans le fonctionnement, absent de la liste p. 97-98)'}
  - {compte: '982', libelle: 'Contrepartie des engagements sur titres', origine: 'S1 p. 262-278 (cité dans le fonctionnement, absent de la liste p. 97-98)'}
  - {compte: '983', libelle: 'Contrepartie des engagements de prêts ou d''emprunts en devises', origine: 'S1 p. 262-278 (cité dans le fonctionnement, absent de la liste p. 97-98)'}
  - {compte: '985', libelle: 'Contrepartie des autres engagements', origine: 'S1 p. 262-278 (cité dans le fonctionnement, absent de la liste p. 97-98)'}
