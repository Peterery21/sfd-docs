    note: 'Éléments + : L10 L20 L27 L30 L35 L41 L45 L50 L55 L59 L60 L65 L70(+) L75* L80(+). Éléments − : L62, E05*, immobilisations incorporelles nettes (D24+D31+D41+D46), L70(−), L80(−), compléments de
      provisions exigés par les Autorités (saisie), participations croisées dans SFD/établissements de crédit (saisie). * L75/E05 : états infra-annuels uniquement. L70 et L80 sont pris algébriquement (une
      seule fois).'
- code: UEMOA-REP-PRU-01
  libelle: Limitation des risques
  periodicite: MENSUELLE
  delaiJours: 30
  assujettis:
  - TOUS
  layout: SFP_SECTIONS
  source: Instr. 010-08-2010, annexe I (art. 147 loi)
  periodiciteParCategorie:
    ART44: MENSUELLE
    AUTRES_SFD: TRIMESTRIELLE
  transmission:
    calcul: 'états au 31/12 : 6 mois (3 ex.) ; mensuel/trimestriel : 1 mois après la période'
  lignes:
  - code: R1_NUM
    libelle: Risques portés (montants nets de provisions et de dépôts de garantie)
    expression: A12+A2A+A3A+A70+B2D+B2N+B30+B40+B70+C10+D1E+D1L+N1A+N1J+N3A+Q1A
    note: 'Engagements par signature donnés = N1A+N1J+N3A+Q1A (texte). « nets des dépôts de garantie » : déduction non détaillée dans l''annexe (F2C, G30 ?) — À CONFIRMER'
  - code: R1_DEN
    libelle: Ressources internes et externes
    expression: F1A+F2A+F3A+F50+G2A+G10+G15+G35+G60+G70+L01
  - code: R1
    libelle: Ratio de limitation des risques (%)
    expression: R1_NUM/R1_DEN*100
    norme:
      operateur: <=
      valeur: 200
      unite: '%'
    note: 'norme : 200 % maximum'
- code: UEMOA-REP-PRU-02
  libelle: Couverture des emplois à moyen et long terme par des ressources stables
  periodicite: TRIMESTRIELLE
  delaiJours: 30
  assujettis:
  - TOUS
  layout: SFP_SECTIONS
  source: Instr. 010-08-2010, annexe II
  periodiciteParCategorie:
    ART44: TRIMESTRIELLE
    AUTRES_SFD: TRIMESTRIELLE
  transmission:
    calcul: 'états au 31/12 : 6 mois (3 ex.) ; mensuel/trimestriel : 1 mois après la période'
  lignes:
