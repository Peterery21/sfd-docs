- code: UEMOA-REP-IND-FIN
  libelle: Indicateurs périodiques — indicateurs financiers
  periodicite: MENSUELLE
  delaiJours: 30
  assujettis:
  - TOUS
  layout: INDICATEURS_SECTIONS
  source: Instr. BCEAO 020-12-2010 art. 1-6, annexe I
  periodiciteParCategorie:
    ART44: MENSUELLE
    AUTRES_SFD: TRIMESTRIELLE
  note: 'PE = comptes 70,71,72,73,75,76 ; CE = comptes 60,61,62,63,64,65,66 (lecture des codes (V08 à X6B − W53) et (R08 à T6B)) : À CONFIRMER'
  lignes:
  - code: IND-F01
    libelle: Portefeuille classé à risque (PAR x jours)
    numerateur: Encours des prêts comportant au moins une échéance impayée depuis plus de x jours (x = 30 ; 90 ; 180)
    denominateur: Montant brut du portefeuille de prêts
    codeRcsfd: (B2D à B70) - B65
    normes:
    - operateur: <
      valeur: 5
      unite: '%'
      condition: x >= 30 jours
    - operateur: <
      valeur: 3
      unite: '%'
      condition: x >= 90 jours
    - operateur: <
      valeur: 2
      unite: '%'
      condition: x >= 180 jours
    note: 'Numérateur : calculé sur l''échéancier (non comptable). Dénominateur : B2D+B2N+B30+B40+B70-B65 ; B70 est net de provisions dans la nomenclature, le texte parle de « brut » → ajouter 2991+2992+2993
      pour le brut (À CONFIRMER)'
  - code: IND-F02
    libelle: Taux de provisions pour créances en souffrance
    numerateur: Montant brut des provisions constituées sur créances en souffrance
    denominateur: Montant brut des créances en souffrance
    codeRcsfd: B70 (2e colonne amortissements et provisions) / B70 (1re colonne montant brut)
    norme:
      operateur: '>='
      valeur: 40
      unite: '%'
    note: Colonnes brut / provisions du bilan
  - code: IND-F03
    libelle: Taux de perte sur créances
    numerateur: Montant des pertes enregistrées sur les créances au cours de la période
    denominateur: Total des encours bruts de crédits de la période, y compris en souffrance
    codeRcsfd: Numérateur T6K+T6L ; dénominateur (B2D à B70) - B65
    norme:
      operateur: <
      valeur: 2
      unite: '%'
  - code: IND-F04
    libelle: Montant moyen des crédits décaissés
    numerateur: Mouvements au débit des comptes de crédits aux membres (CT, MT, LT) au niveau de la balance générale
    denominateur: Nombre total de crédits décaissés au cours de la période
    codeRcsfd: —
    norme:
      operateur: TENDANCE
      valeur: HAUSSIERE
      note: pas de seuil
    note: Pas de code RCSFD pour le nombre de crédits
  - code: IND-F05
    libelle: Montant moyen de l'épargne par épargnant
    numerateur: Dépôts des membres ou bénéficiaires (fin de période)
    denominateur: Nombre d'épargnants (personnes ayant un ou plusieurs dépôts, y compris épargne obligatoire, comptées une fois)
    codeRcsfd: G10 à G35
    norme:
      operateur: TENDANCE
      valeur: HAUSSIERE
      note: pas de seuil
  - code: IND-F06
    libelle: Encours moyen des crédits par emprunteur
    numerateur: Crédits sains + crédits en souffrance (fin de période)
    denominateur: Nombre de personnes ayant un encours de crédit (comptées une fois)
    codeRcsfd: (B2D à B70) - B65
    norme:
      operateur: TENDANCE
      valeur: HAUSSIERE
      note: pas de seuil
  - code: IND-F07
    libelle: Productivité des agents de crédit
    numerateur: Nombre d'emprunteurs actifs
    denominateur: Nombre d'agents de crédit
    codeRcsfd: —
    normes:
    - operateur: '>='
      valeur: 130
      unite: ratio par agent/employé
      condition: les structures non conformes doivent en donner les raisons
  - code: IND-F08
    libelle: Productivité du personnel
    numerateur: Nombre de clients actifs (au moins un dépôt ou un crédit en cours)
    denominateur: Nombre d'employés
    codeRcsfd: —
    norme:
      operateur: '>'
      valeur: 115
      unite: ratio par agent/employé
  - code: IND-F09
    libelle: Charges d'exploitation rapportées au portefeuille de crédits
    numerateur: Charges d'exploitation (CE)
    denominateur: Montant brut moyen du portefeuille de crédits de la période
    codeRcsfd: (R08 à T6B) / Moyenne [(B2D à B70) - B65]
    norme:
      operateur: <=
      valeur: 35
      unite: '%'
    note: CE = comptes 60+61+62+63+64+65+66
  - code: IND-F10
    libelle: Ratio des frais généraux rapportés au portefeuille de crédits
    numerateur: Frais de personnel + impôts et taxes + autres charges externes et charges diverses d'exploitation + dotations au fonds pour risques financiers généraux
    denominateur: Montant brut moyen du portefeuille de crédits de la période
    codeRcsfd: S02 à T50 / Moyenne [(B2D à B70) - B65]
    normes:
    - operateur: <
      valeur: 15
      unite: '%'
      condition: structures de crédit direct
    - operateur: <
      valeur: 20
      unite: '%'
      condition: structures d'épargne et de crédit
    note: S02+S1A+S2A+T50
  - code: IND-F11
    libelle: Ratio des charges de personnel
    numerateur: Salaires et traitements + charges sociales + rémunérations versées aux stagiaires
    denominateur: Montant brut moyen du portefeuille de crédits de la période
    codeRcsfd: S02 / Moyenne [(B2D à B70) - B65]
    normes:
    - operateur: <
      valeur: 5
      unite: '%'
      condition: structures de crédit direct
    - operateur: <
      valeur: 10
      unite: '%'
      condition: structures d'épargne et de crédit
  - code: IND-F12
    libelle: Rentabilité des fonds propres
    numerateur: Résultat d'exploitation hors subventions (RE = PE − CE)
    denominateur: Montant moyen des fonds propres pour la période
    codeRcsfd: (V08 à X6B − W53) − (R08 à T6B) / L01
    norme:
      operateur: '>'
      valeur: 15
      unite: '%'
    note: PE = comptes 70+71+72+73+75+76 ; CE = comptes 60+61+62+63+64+65+66 ; dénominateur = L01 (code cité par le texte)
  - code: IND-F13
    libelle: Rendement sur actif
    numerateur: Résultat d'exploitation hors subventions (RE)
    denominateur: Montant moyen de l'actif pour la période
    codeRcsfd: RE / E90
    norme:
      operateur: '>'
      valeur: 3
      unite: '%'
  - code: IND-F14
    libelle: Autosuffisance opérationnelle
    numerateur: Produits d'exploitation (PE)
    denominateur: Charges d'exploitation (CE)
    codeRcsfd: (V08 à X6B − W53) / (R08 à T6B)
    norme:
      operateur: '>'
      valeur: 130
      unite: '%'
  - code: IND-F15
    libelle: Marge bénéficiaire
    numerateur: Résultat d'exploitation (RE)
    denominateur: Produits d'exploitation (PE)
    codeRcsfd: RE / (V08 à X6B − W53)
    norme:
      operateur: '>'
      valeur: 20
      unite: '%'
  - code: IND-F16
    libelle: Coefficient d'exploitation
    numerateur: Frais généraux (FG)
    denominateur: Produits financiers nets (PFN)
    codeRcsfd: S02 à T50 / [(V08 à V7A) − (R08 à R7A)]
    normes:
    - operateur: <=
      valeur: 40
      unite: '%'
      condition: structures de crédit direct
    - operateur: <=
      valeur: 60
      unite: '%'
      condition: structures d'épargne et de crédit
    note: FG = S02+S1A+S2A+T50 ; PFN = (V08+V3A+V4B+V5B+V6U+V7A) − (R08+R3A+R4B+R5B+R6V+R7A)
  - code: IND-F17
    libelle: Taux de rendement des actifs
    numerateur: Intérêts et commissions perçus (V08 à V7A)
    denominateur: 'Actifs productifs : opérations avec institutions financières + membres + titres à court terme + immobilisations financières'
    codeRcsfd: (A01−A10−A60−A70)+(B01−B65−B70)+(C10+C56)+D1A
    norme:
      operateur: '>'
      valeur: 15
      unite: '%'
  - code: IND-F18
    libelle: Ratio de liquidité de l'actif
    numerateur: Encaisses et comptes courants ordinaires + titres à court terme
    denominateur: Total actif du bilan
    codeRcsfd: (A10+A12+A2H+A2J+C10) / E90
    normes:
    - operateur: '>'
      valeur: 2
      unite: '%'
      condition: structures de crédit direct
    - operateur: '>'
      valeur: 5
      unite: '%'
      condition: structures d'épargne et de crédit
    note: 'Le texte imprime « A2H++A2J » (double plus) : À CONFIRMER'
  - code: IND-F19
    libelle: Ratio de capitalisation (indicateur)
    numerateur: Fonds propres (L01)
    denominateur: Total actif du bilan (E90)
    codeRcsfd: L01 / E90
    norme:
      operateur: '>'
      valeur: 15
      unite: '%'
    note: Différent de la norme prudentielle R8 (fonds propres réglementaires retraités)
- code: UEMOA-REP-IND-NF
  libelle: Indicateurs périodiques — indicateurs non financiers
  periodicite: MENSUELLE
  delaiJours: 30
  assujettis:
  - TOUS
  layout: INDICATEURS_SECTIONS
  source: Instr. BCEAO 020-12-2010, annexe II
  periodiciteParCategorie:
    ART44: MENSUELLE
    AUTRES_SFD: TRIMESTRIELLE
  colonnes:
  - T_1
  - T
  - VARIATION_PCT
  lignes:
  - code: IND-N01
    libelle: 'Tableau n°1 : Nombre de membres, bénéficiaires ou clients'
    postes:
    - Nombre total de membres, bénéficiaires ou clients (1)+(2)
    - Personnes physiques non-membres d'un groupement (1) = (à)+(b) ; hommes (à) ; femmes (b)
    - Personnes morales (groupements de personnes physiques, entreprises, associations…) (2)
    - Nombre de groupements de personnes physiques bénéficiaires
    - Nombre total des membres des groupements de personnes physiques bénéficiaires (3) = (c)+(d) ; hommes (c) ; femmes (d)
  - code: IND-N02
    libelle: 'Tableau n°2 : Effectif des dirigeants et du personnel employé'
    postes:
    - Nombre de membres du Conseil d'Administration ou de l'organe équivalent
    - Nombre de membres du Conseil de Surveillance, s'il y à lieu
    - Nombre de membres du Comité de Crédit, s'il y à lieu
    - Effectif total des employés = (1)+(2) ; dirigeants exerçant des fonctions de direction ou de gérance (1) ; autres employés (2)
    - Agents permanents ; agents contractuels ; personnel expatrié sous contrat à durée déterminée / indéterminée ; agents nationaux ; personnel expatrié
  - code: IND-N03
    libelle: 'Tableau n°3 : Nombre des déposants'
    postes:
    - Nombre total de déposants (1)+(2)
    - Personnes physiques non-membres d'un groupement (1) = (à)+(b), hommes (à), femmes (b)
    - Personnes morales (groupements, entreprises, associations) (2)
  - code: IND-N04
    libelle: 'Tableau n°4 : Nombre de crédits en cours'
    postes:
    - Nombre de crédits en cours (1)+(2)
    - Personnes physiques non-membres d'un groupement (1) = (à)+(b), hommes (à), femmes (b)
    - Personnes morales (2)
  - code: IND-N05
    libelle: 'Tableau n°5 : Répartition des crédits selon leur objet (en milliers de FCFA)'
    postes:
    - Crédits immobiliers
    - Crédits d'équipement
    - Crédits à la consommation
    - Crédits de trésorerie
    - Autres crédits
  - code: IND-N06
    libelle: 'Tableau n°6 : Nombre de crédits en souffrance'
    postes:
    - Nombre de crédits en souffrance (1)+(2)
    - Personnes physiques non-membres d'un groupement (1) = (à)+(b), hommes (à), femmes (b)
    - Personnes morales (2)
  - code: IND-N07
    libelle: 'Tableau n°7 : Indicateurs sur la surveillance'
    postes:
    - Nombre d'institutions affiliées *
    - Nombre d'institutions affiliées contrôlées *
    - Taux de mise en œuvre des recommandations formulées au cours des contrôles *
    - Nombre de réunions tenues par le Conseil de Surveillance *
    - Nombre d'agences ou de points de services **
    - Nombre de rapports de contrôle interne **
