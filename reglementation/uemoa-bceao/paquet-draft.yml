# Paquet de localisation UEMOA-BCEAO — BROUILLON (recherche du 2026-10-19)
# Source de vérité des formules : sfd-docs/reglementation/uemoa-bceao/reporting.md
# NE PAS COMMITER tel quel : A CONFIRMER signalé dans le champ statut / note. Aucun compte déduit par analogie ; inconnu = NON_TROUVE.
# Écrasement prévu du fichier zones/uemoa-bceao.yml (concordances actuelles fausses, voir reporting.md §d).
zone: UEMOA-BCEAO
regulateur: 'BCEAO / Commission Bancaire de l''UMOA (tutelle nationale : Ministre des Finances)'
planComptable: RCSFD-UMOA
version: 2026-10-19-draft
pays:
- BJ
- BF
- CI
- GW
- ML
- NE
- SN
- TG
conventions:
  comptes: préfixes RCSFD séparés par virgule ; '-' = à soustraire ; comptesEx = comptes 'extraits' (solde du sens de la rubrique)
  expression: références de lignes par code (A-Z0-9_), opérateurs + - * / et parenthèses ; MIN() = extension à implémenter
  extensions-a-valider:
  - comptesAllegee
  - comptesEx
  - normesParCategorie
  - filtre d'échéance résiduelle (R2, R5)
  - agrégation MOYENNE_PERIODE (IND-F09..F16)
  periodicite: ANNUELLE | MENSUELLE | TRIMESTRIELLE | EVENEMENT | A_CONFIRMER
  resolutionCodes: un même poste porte le même code dans tous les états (principe RCSFD) ; les expressions se résolvent sur DIMF-2000-BIL, DIMF-2000-HB, DIMF-2080 puis sur les états annexes
  assujettis: TOUS | ART44 | AUTRES_SFD | FAITIERES | RESEAUX | IMF
  delaiJours: jours calendaires ; 180 = 6 mois ; 30 = 1 mois ; null = non trouvé ou échéance fixe (voir echeance)
rapports:
- code: DIMF-2000-BIL
  libelle: Bilan (DIMF 2000) — développée (art. 44) et allégée
  periodicite: ANNUELLE
  delaiJours: 180
  assujettis:
  - TOUS
  layout: BILAN_BICOLONNE
  source: Instr. BCEAO 025-02-2009, 030-02-2009 (art. 2-8), 001-02-2018 ; RCSFD (annexes) ; annexes 1.1, 2.1-2.3
  codeEtat: AA0 (actif) / AB0 (passif)
  colonnes:
  - BRUT
  - AMT_PROV
  - NET
  - NET_N1
  versions:
    DEVELOPPEE: SFD art. 44 (encours >= 2 Md FCFA sur 2 exercices) ; option possible pour les autres
    ALLEGEE: encours dépôts ou crédit < 50 M FCFA sur 2 exercices (Instr. 021-12-2010)
  note: comptes = version développée ; comptesAllegee = version allégée si différente ; allegee:false = poste absent de l'allégée. comptesEx = comptes 'extraits' (solde débiteur compté à l'actif, créditeur
    au passif, selon la rubrique). Les montants NET = concordance telle que publiée (provisions et amortissements déjà déduits par les signes -).
