- code: UEMOA-REP-PRU-07
  libelle: Constitution de la réserve générale
  periodicite: TRIMESTRIELLE
  delaiJours: 30
  assujettis:
  - TOUS
  layout: SFP_SECTIONS
  source: Instr. 010-08-2010, annexe VII ; loi art. 85 et 124
  periodiciteParCategorie:
    ART44: TRIMESTRIELLE
    AUTRES_SFD: TRIMESTRIELLE
  transmission:
    calcul: 'états au 31/12 : 6 mois (3 ex.) ; mensuel/trimestriel : 1 mois après la période'
  lignes:
  - code: R7_BASE
    libelle: 'Base de calcul : résultat (L80) + report à nouveau déficitaire (L70)'
    expression: L80+MIN(L70,0)
    note: 'Fonction MIN hors syntaxe + - * / : à implémenter (L70 négatif seulement). Texte : « Résultat (L80) + Report à nouveau déficitaire (L70) »'
  - code: R7
    libelle: Dotation annuelle minimale à la réserve générale (L56)
    expression: R7_BASE*0.15
    normeDotation:
      operateur: '>='
      valeur: 15
      unite: '% de R7_BASE'
    note: Dotation minimale 15 % de la base ; obligatoire quel que soit le cumul
