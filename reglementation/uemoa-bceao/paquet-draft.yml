    libelle: Ressources stables (parts à durée résiduelle > 12 mois)
    expression: L01+F2A+F3F+F50+G15+G2A+G30+G35+G60+G70
    note: 'Filtre d''échéance résiduelle > 12 mois obligatoire sur F2A, F3F, F50, G15, G2A, G30, G35, G60, G70 (texte : « à moyen et long terme »)'
  - code: R2_DEN
    libelle: Emplois à moyen et long terme (montants nets, durée résiduelle > 12 mois)
    expression: A2H+A2I+A2J+A3C+A70+B30+B40+B70+D1E+D1L+D10+D1S+D23+D30+D40
    note: 'A70, B70 nets de provisions ; D40 = immobilisations hors exploitation (texte : D40)'
  - code: R2
    libelle: Ratio de couverture des emplois MLT (%)
    expression: R2_NUM/R2_DEN*100
    norme:
      operateur: '>='
      valeur: 100
      unite: '%'
    note: 'norme : 100 % minimum'
