- code: UEMOA-REP-PRU-05
  libelle: Coefficient de liquidité
  periodicite: MENSUELLE
  delaiJours: 30
  assujettis:
  - TOUS
  layout: SFP_SECTIONS
  source: Instr. 010-08-2010, annexe V
  periodiciteParCategorie:
    ART44: MENSUELLE
    AUTRES_SFD_DEPOT: MENSUELLE
    AUTRES_SFD_SANS_DEPOT: TRIMESTRIELLE
  transmission:
    calcul: 'états au 31/12 : 6 mois (3 ex.) ; mensuel/trimestriel : 1 mois après la période'
  lignes:
  - code: R5_NUM
    libelle: Valeurs réalisables et disponibles (montants nets, durée résiduelle ≤ 3 mois)
    expression: A10+A12+A2J+A2A+A3B+B2D+B2N+B30+B40+C10+C30+C40+C56+(A60+B65+C55)+(N1A+N1J+N2A+N2J)
    note: 'Filtre échéance résiduelle ≤ 3 mois. Annotation manuscrite « ≤ 3 mois » à côté de B30 sur le scan. A2J est libellé « dépôts à court terme » dans l''annexe alors que le poste A2J = 1281 (autres
      dépôts constitués) : À CONFIRMER. Engagements donnés au numérateur (texte).'
  - code: R5_DEN
    libelle: Passif exigible (durée résiduelle ≤ 3 mois)
    expression: F1A+F2A+F3E+F3F+F50+G10+G15+G2A+G30+G35+G60+G70+H10+H40+(F60+G90)+(N1H+N1K+N2H+N2M)
    note: Engagements de financement et de garantie reçus au dénominateur (texte)
  - code: R5
    libelle: Coefficient de liquidité (%)
    expression: R5_NUM/R5_DEN*100
    norme:
      operateur: '>='
      valeur: 100
      unite: '%'
    normesParCategorie:
    - categorie: MUTUALISTE_NON_AFFILIEE_OU_AUTRE_SFD_COLLECTANT_DEPOTS
      operateur: '>='
      valeur: 100
    - categorie: MUTUALISTE_AFFILIEE
      operateur: '>='
      valeur: 80
    - categorie: SFD_SANS_COLLECTE_DEPOTS
      operateur: '>='
      valeur: 60
    note: norme selon catégorie, voir normesParCategorie
